<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Navy Blue (#0d233a to #163b61) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d233a"/>
      <stop offset="50%" stop-color="#112d4a"/>
      <stop offset="100%" stop-color="#163b61"/>
    </linearGradient>
    
    <!-- Accent Sky-Blue to Mint Gradient for Arrow & Highlights -->
    <linearGradient id="arrowGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- M Letterform Gradient -->
    <linearGradient id="mGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <!-- Drop Shadow for M Emblem -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
    
    <!-- Subtle Inner Border Glow -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Soft Rounded Square Container (Outer Base) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGradient)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGlow)" stroke-width="4"/>

  <!-- Stylized 'M' Icon with Financial Growth Arrow woven in -->
  <g filter="url(#subtleGlow)" transform="translate(0, -12)">
    <!-- Left Leg of 'M' -->
    <path d="M 124 290 L 124 165 C 124 153 133 144 145 144 C 157 144 166 153 166 165 L 166 290 C 166 302 157 311 145 311 C 133 311 124 302 124 290 Z" fill="url(#mGradient)"/>

    <!-- Left Diagonal to Center Valley -->
    <path d="M 158 152 L 256 250 L 226 280 L 138 192 Z" fill="url(#mGradient)" opacity="0.95"/>

    <!-- Center Valley to Right Diagonal Rising Upward -->
    <path d="M 230 274 L 340 164 L 368 192 L 258 302 Z" fill="url(#mGradient)"/>

    <!-- Right Leg of 'M' -->
    <path d="M 346 290 L 346 200 C 346 188 355 179 367 179 C 379 179 388 188 388 200 L 388 290 C 388 302 379 311 367 311 C 355 311 346 302 346 290 Z" fill="url(#mGradient)"/>

    <!-- Dynamic Financial Growth Trend Arrow (Sky-Blue Gradient woven through M) -->
    <path d="M 170 270 Q 250 230 330 148 L 320 138 L 385 130 L 377 195 L 350 168 Q 260 250 170 290 Z" fill="url(#arrowGradient)"/>
    
    <!-- Growth Arrow Head Peak Accent -->
    <polygon points="385,130 345,145 370,170" fill="#38bdf8"/>
    <circle cx="385" cy="130" r="7" fill="#ffffff"/>
  </g>

  <!-- Crisp Bold White 'MYFIN' Typography -->
  <text x="256" y="415" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="52" 
        font-weight="900" 
        letter-spacing="9" 
        fill="#ffffff" 
        text-anchor="middle">
    MYFIN
  </text>
  
  <!-- Subtle Slogan / Tagline -->
  <text x="256" y="445" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="4" 
        fill="#94a3b8" 
        text-anchor="middle">
    GLOBAL WEALTH
  </text>
</svg>
