<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Navy to Midnight Blue) -->
    <linearGradient id="myfinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2246"/>
      <stop offset="50%" stop-color="#0a162e"/>
      <stop offset="100%" stop-color="#040914"/>
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="outerStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.3"/>
    </linearGradient>

    <!-- White 'M' Letterform Gradient -->
    <linearGradient id="whiteM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Emerald-Mint 'F' Letterform Gradient -->
    <linearGradient id="mintF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Trendline & Arrow Mint Gradient -->
    <linearGradient id="trendGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Blue Bar Chart Column Gradient -->
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- FIN Text Mint Gradient -->
    <linearGradient id="finTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Drop Shadow Filter for MF Emblem -->
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Icon Base: Squircle Frame -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="url(#myfinBg)" stroke="url(#outerStroke)" stroke-width="4"/>

  <!-- Main Center Artwork: MF Emblem & Financial Growth Chart -->
  <g filter="url(#emblemShadow)" transform="translate(0, -10)">
    
    <!-- 1. Left White 'M' Shape -->
    <!-- Left vertical upright and center diagonal -->
    <path d="M 136 295 L 136 128 C 136 112 150 98 166 98 L 180 98 C 196 98 208 110 216 126 L 256 226 L 296 126 C 304 110 316 98 332 98 L 338 98 C 344 98 348 102 346 108 L 320 180 C 314 196 298 208 282 208 L 272 208 L 244 278 C 238 292 224 300 208 300 L 148 300 C 141 300 136 298 136 295 Z" fill="url(#whiteM)" />

    <!-- 2. Right Mint Green 'F' Shape -->
    <!-- Top Horizontal Wing -->
    <path d="M 284 98 L 372 98 C 396 98 414 116 414 140 C 414 150 406 158 396 158 L 326 158 C 312 158 300 170 300 184 L 300 236 C 300 248 290 258 278 258 L 272 258 C 266 258 262 254 264 248 L 272 200 C 274 186 286 174 300 174 L 370 174 C 382 174 392 184 392 196 C 392 208 382 218 370 218 L 340 218 L 340 260 C 340 274 328 286 314 286 L 284 286 C 278 286 274 282 276 276 L 284 98 Z" fill="url(#mintF)" />

    <!-- 3. Rising Vertical Bar Chart (Right side background behind trendline) -->
    <!-- Bar 1 (Lowest) -->
    <rect x="252" y="305" width="22" height="28" rx="6" fill="url(#barGrad2)" opacity="0.9" />
    <!-- Bar 2 -->
    <rect x="286" y="290" width="22" height="43" rx="6" fill="url(#barGrad2)" />
    <!-- Bar 3 -->
    <rect x="320" y="270" width="22" height="63" rx="6" fill="url(#barGrad1)" />
    <!-- Bar 4 -->
    <rect x="354" y="250" width="22" height="83" rx="6" fill="url(#barGrad1)" />
    <!-- Bar 5 (Tallest) -->
    <rect x="388" y="222" width="22" height="111" rx="6" fill="url(#barGrad1)" />

    <!-- 4. Dynamic Rising Trendline with Data Points and Arrow -->
    <!-- Trendline path -->
    <path d="M 126 322 L 194 280 L 238 294 L 292 264 L 362 254 L 416 216" 
          fill="none" 
          stroke="url(#trendGradient)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Trendline Arrow Head pointing Up-Right -->
    <path d="M 398 206 L 426 210 L 418 238 Z" fill="url(#trendGradient)" />

    <!-- Data Points (Circles) along the trendline -->
    <circle cx="126" cy="322" r="6" fill="#34d399" stroke="#0a162e" stroke-width="2.5" />
    <circle cx="194" cy="280" r="6" fill="#34d399" stroke="#0a162e" stroke-width="2.5" />
    <circle cx="238" cy="294" r="6" fill="#34d399" stroke="#0a162e" stroke-width="2.5" />
    <circle cx="292" cy="264" r="6" fill="#34d399" stroke="#0a162e" stroke-width="2.5" />
    <circle cx="362" cy="254" r="6" fill="#34d399" stroke="#0a162e" stroke-width="2.5" />
  </g>

  <!-- 5. Branding Typography: "MYFIN" -->
  <g transform="translate(256, 395)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
          font-size="54" 
          font-weight="900" 
          letter-spacing="5">
      <tspan fill="#FFFFFF">MY</tspan><tspan fill="url(#finTextGrad)">FIN</tspan>
    </text>
  </g>

  <!-- 6. Slogan: "PLAN  •  TRACK  •  GROW" -->
  <g transform="translate(256, 432)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="14" 
          font-weight="800" 
          letter-spacing="6" 
          fill="#94a3b8">
      PLAN  •  TRACK  •  GROW
    </text>
  </g>
</svg>
